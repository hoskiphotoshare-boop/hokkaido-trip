name: Hokkaido Dashboard Data Sync

on:
  schedule:
    # Runs every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows you to click a button to run it manually

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest
    
    # This permission is required for the bot to push the file back to your repo
    permissions:
      contents: write 
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install requests beautifulsoup4 deep-translator
        
      - name: Run Aggregator Script
        run: python update_data.py
        
      - name: Commit and Push JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          git commit -m "Automated data sync: Update ski dashboard JSON" || echo "No changes to commit"
          git push
